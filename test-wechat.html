<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body { margin: 0; background: #1e1e1e; display: flex; justify-content: center; }
		#container { width: 320px; }
	</style>
	<link rel="stylesheet" href="dist/wechat-webview.css">
</head>
<body>
<div id="container">
	<div id="root"><p style="padding:12px;color:#888;font-size:12px;">Loading...</p></div>
</div>
<script>
const acquireVsCodeApi = () => ({
	postMessage: (msg) => {
		console.log('[postMessage]', JSON.stringify(msg));
		if (msg.type === 'requestState') {
			setTimeout(() => {
				window.dispatchEvent(new MessageEvent('message', { data: {
					type: 'fullState',
					accounts: [
						{ id: 'wx_test1', name: '工作微信', isPrimary: true, state: 'connected', active: true, bindingSessions: ['session-abc'], qrDataUrl: null },
						{ id: 'wx_test2', name: '个人微信', isPrimary: false, state: 'idle', active: false, bindingSessions: [], qrDataUrl: null },
					],
					sessions: [
						{ id: 'session-abc', name: 'AI Chat 1', alive: true },
						{ id: 'session-def', name: 'Code Review', alive: true },
						{ id: 'session-ghi', name: '旧会话', alive: false },
					],
					loginPendingAccountId: null,
				}}));
			}, 100);
		}
		if (msg.type === 'addAccount') {
			console.log('[TEST] addAccount:', msg.name);
		}
	},
	setState: () => {},
	getState: () => null,
});
const vscode = acquireVsCodeApi();
</script>
<script src="dist/wechat-webview.js" onerror="document.getElementById('root').innerHTML='<p style=\'padding:12px;color:#f44;\'>Failed to load wechat-webview.js. Run: npm run build</p>';"></script>
</body>
</html>
